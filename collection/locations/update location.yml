info:
  name: update location
  type: http
  seq: 1

http:
  method: PUT
  url: "{{basetrips}}/:tripId/location"
  params:
    - name: tripId
      value: "10"
      type: path
  body:
    type: json
    data: |-
      {
        "latitude": 33.74,
        "longitude": -84.00
      }
  auth:
    type: bearer
    token: "{{userBToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
