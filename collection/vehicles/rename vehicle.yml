info:
  name: rename vehicle
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{basetrips}}/:tripId/vehicles/:vehicleId"
  params:
    - name: tripId
      value: "4"
      type: path
    - name: vehicleId
      value: "7"
      type: path
  body:
    type: json
    data: |-
      {
        "type" : "motorcycle"
      }
  auth:
    type: bearer
    token: "{{userAToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
