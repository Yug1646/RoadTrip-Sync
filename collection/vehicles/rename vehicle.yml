info:
  name: rename vehicle
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{basetrips}}/:tripId/vehicles/:vehicleId"
  params:
    - name: tripId
      value: "8"
      type: path
    - name: vehicleId
      value: "12"
      type: path
  body:
    type: json
    data: |-
      {
        "type" : "car"
      }
  auth:
    type: bearer
    token: "{{userBToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
