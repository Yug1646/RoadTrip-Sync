info:
  name: create new trip
  type: http
  seq: 1

http:
  method: POST
  url: "{{basetrips}}/"
  body:
    type: json
    data: |-
      { 
        "name": "College Reunion", 
        "startLocation": "Boston, MA", 
        "endLocation": "Cape Cod, MA", 
        "type": "car" 
      }
  auth:
    type: bearer
    token: "{{userBToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
