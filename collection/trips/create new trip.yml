info:
  name: create new trip
  type: http
  seq: 1

http:
  method: POST
  url: "{{basetrips}}/"
  body:
    type: json
    data: |-
      {
        "name": "Golden Gate bridge to Empire State",
        "status" : "completed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
